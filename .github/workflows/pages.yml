name: CI and Pages deploy

# One workflow, deliberately. A PR gets everything; a push to main gets
# everything and then deploys.
#
# Playwright runs here and nowhere else before this change: 715 of the tests
# that caught every real defect in this project were never run by CI, so a
# green build meant "lint passes and jsdom is happy", which is a much weaker
# claim than it looks.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deploy — it would leave Pages serving a partial site.
# On a PR the newest run still supersedes the older one, because there is
# nothing to corrupt.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      # Every accent, against every surface, in both themes. Exits non-zero on
      # any WCAG AA miss, which is the whole reason it is a step rather than a
      # script somebody remembers to run.
      - name: Palette contrast
        run: node scripts/check-palette.mjs

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # --with-deps installs the system libraries Chromium needs. Without it the
      # browser launches and then dies on a missing shared object, which fails
      # as a timeout rather than as the obvious error.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Build static site
        run: npm run build:pages

      - uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .pages

  deploy:
    needs: build
    # A pull request has to prove the same thing, but it must not publish.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
